services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: cropwatch
      POSTGRES_PASSWORD: cropwatch
      POSTGRES_DB: cropwatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cropwatch -d cropwatch"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgresql://cropwatch:cropwatch@db:5432/cropwatch
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      DATA_DIR: /data
      RULES_DIR: /rules
      EE_PROJECT: ${EE_PROJECT:-}
    volumes:
      - ./data:/data
      - ./rules:/rules
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
